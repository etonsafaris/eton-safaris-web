# Deploy to Cloudflare Workers (OpenNext)
# Required GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Optional (recommended): DATABASE_URL — used only at deploy time for Hyperdrive CLI emulation on CI
# Runtime secrets (DATABASE_URL, etc.) live on the Worker via `npm run secrets:cloudflare` or dashboard.

name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: OpenNext build
        run: npm run build:worker
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          SKIP_BUILD_STAYS: '1'
          SKIP_BUILD_STATIC_PARAMS: '1'
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.DATABASE_URL }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: wrangler deploy
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.DATABASE_URL }}
