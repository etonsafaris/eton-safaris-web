# Deploy to Cloudflare Workers (OpenNext) — works even when Pages Git auto-deploy is paused.
# Required GitHub repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Worker env vars (DATABASE_URL, NEXTAUTH_SECRET, …): Cloudflare dashboard → Workers → eton-safaris-web → Settings → Variables

name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: OpenNext build
        run: npm run build:cloudflare
        env:
          CF_PAGES: '1'
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
