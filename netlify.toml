# Eton Safaris — Netlify (Next.js App Router)
#
# In Netlify UI → Site configuration → Build & deploy:
# - Clear "Publish directory" (leave empty). The Next.js plugin sets output.
# - Do not set a custom publish path to `.next` when using @netlify/plugin-nextjs.

[build]
  # CI= avoids npm/Next treating warnings as hard failures on Netlify.
  command = "CI= npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
  NODE_OPTIONS = "--max-old-space-size=6144"
  SKIP_BUILD_STAYS = "1"
  SKIP_BUILD_STATIC_PARAMS = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
